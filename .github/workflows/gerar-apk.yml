# Gera o APK Android nos servidores do GitHub (grátis, sem conta na Expo) e publica em "Releases".
# Roda quando o código do app muda ou manualmente pela aba "Actions".
name: Gerar APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/gerar-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gerar-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos e embutir os dados atuais
        run: npm run tipos

      - name: Numerar a versão (cada APK novo instala por cima do anterior)
        run: |
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            cfg.expo.version = "1.0." + process.env.GITHUB_RUN_NUMBER;
            cfg.expo.android.versionCode = Number(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync("app.json", JSON.stringify(cfg, null, 2));
          '

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"

      - name: Compilar APK
        working-directory: app/android
        # Só as arquiteturas de celulares reais (deixa o APK menor).
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSAO="v1.0.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk "UFC-Predictor-${VERSAO}.apk"
          gh release create "$VERSAO" "UFC-Predictor-${VERSAO}.apk" \
            --title "UFC Predictor ${VERSAO}" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}. Baixe o arquivo .apk abaixo no celular e instale." \
            --latest
